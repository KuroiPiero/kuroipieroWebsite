<style>
/* ══════════════════════════════════════════════════════
   HEADQUARTERS — change anything here, it changes everywhere
   ══════════════════════════════════════════════════════ */
:root{
  --near-black-blue: #000216;   /* the void — page background   */
  --sea-blue:        #1791B1;   /* main neon                    */
  --byzantium:       #602455;   /* purple grime                 */
  --glowing-pink:    #ff009d;   /* hot pink accent              */
  --royal:           #0f9e50;   /* Al-Ahli green                */
  --royal-shade:     #32f03c;   /* Al-Ahli glow                 */

  --alice-blue:      #eaf6ff;   /* white-hot spark core         */
  --light-blue:      #9fd0de;   /* spark halo                   */
  --dark-slate:      #14313c;   /* the dead 'n' letter          */
  --ming:            #3f6e70;   /* dim label text               */
  --air-force-blue:  #5f93a4;   /* marker handwriting           */

  /* Same colors as RGB triplets, so translucent versions can use
     them too:  rgba(var(--sea-blue-rgb), .2)  */
  --sea-blue-rgb:      23,145,177;
  --byzantium-rgb:     96,36,85;
  --glowing-pink-rgb:  255,0,157;
  --royal-shade-rgb:   50,240,60;
  --light-blue-rgb:    159,208,222;

  /* Dials */
  --glow:    26px;      /* neon glow size                       */
  --grime:   .7;        /* dirt layer strength, 0 to 1          */
  --flicker: running;   /* set to 'paused' to freeze everything */
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--near-black-blue);}
a{color:var(--sea-blue);text-decoration:none;}
a:hover{color:var(--glowing-pink);}
::selection{background:var(--glowing-pink);color:var(--near-black-blue);}

/* One switch for every animation on the page */
.junkyard,.junkyard *{animation-play-state:var(--flicker);}


/* ══════════════════════════════════════════════════════
   ANIMATIONS
   ══════════════════════════════════════════════════════ */

/* healthy tube — mostly lit, occasional stutter */
@keyframes flick{
  0%,7%,9%,23%,26%,52%,55%,78%,100%{opacity:1}
  8%{opacity:.2}  10%{opacity:.75}
  24%{opacity:.3} 25%{opacity:.9}
  53%{opacity:.15} 54%{opacity:.8}
  79%{opacity:.35} 80%{opacity:1}
}

/* dying tube — mostly dark, rare desperate flashes */
@keyframes dying{
  0%,2%,5%,28%,31%,58%,61%,100%{opacity:.14}
  3%{opacity:.95} 4%{opacity:.2}
  29%{opacity:.85} 30%{opacity:.18}
  59%{opacity:1}  60%{opacity:.35}
  74%{opacity:.9} 75%{opacity:.14}
}

/* electrical buzz */
@keyframes buzz{
  0%,100%{opacity:.7} 42%{opacity:1} 45%{opacity:.35} 48%{opacity:1}
}

/* the whole sign swinging on its rods */
@keyframes sway{
  0%,100%{transform:rotate(-2.4deg)} 50%{transform:rotate(-1.6deg)}
}

/* spark popping at a loose connection */
@keyframes spark{
  0%,100%{opacity:0; transform:scale(.4)}
  2%{opacity:1; transform:scale(1.5)}
  5%{opacity:.1; transform:scale(.7)}
  7%{opacity:.9; transform:scale(1.2)}
  9%{opacity:0; transform:scale(.5)}
  41%{opacity:0}
  43%{opacity:1; transform:scale(1.6)}
  46%{opacity:0}
}

/* the arc flash around the spark */
@keyframes arc{
  0%,100%{opacity:0} 2%{opacity:1} 6%{opacity:.15} 8%{opacity:.8}
  10%{opacity:0} 42%{opacity:0} 44%{opacity:1} 47%{opacity:0}
}

/* embers falling off the break */
@keyframes fall{
  0%{opacity:0; transform:translate(0,0) scale(1)}
  4%{opacity:1}
  100%{opacity:0; transform:translate(-14px,46px) scale(.3)}
}

/* the jester mask lit by the sparks below it */
@keyframes clown{
  0%,5%,9%,32%,36%,61%,65%,88%,100%{opacity:.5;filter:grayscale(.5) brightness(.85) drop-shadow(0 8px 14px rgba(0,0,0,.9)) drop-shadow(0 0 14px rgba(var(--sea-blue-rgb),.75))}
  6%{opacity:.16;filter:grayscale(.85) brightness(.4) drop-shadow(0 8px 14px rgba(0,0,0,.9))}
  8%{opacity:.66;filter:grayscale(.2) brightness(1.25) drop-shadow(0 0 22px rgba(var(--light-blue-rgb),.95))}
  33%{opacity:.12;filter:grayscale(.9) brightness(.35) drop-shadow(0 8px 14px rgba(0,0,0,.9))}
  35%{opacity:.7;filter:grayscale(.15) brightness(1.4) drop-shadow(0 0 26px rgba(var(--glowing-pink-rgb),.8))}
  62%{opacity:.2;filter:grayscale(.8) brightness(.45) drop-shadow(0 8px 14px rgba(0,0,0,.9))}
  64%{opacity:.62;filter:grayscale(.25) brightness(1.2) drop-shadow(0 0 20px rgba(var(--sea-blue-rgb),.9))}
  89%{opacity:.14;filter:grayscale(.9) brightness(.4) drop-shadow(0 8px 14px rgba(0,0,0,.9))}
}

/* the mask swinging on its wire */
@keyframes hang{
  0%,100%{transform:rotate(-3.2deg)} 50%{transform:rotate(2.6deg)}
}


/* ══════════════════════════════════════════════════════
   THE YARD ITSELF
   ══════════════════════════════════════════════════════ */
.junkyard{
  position:relative;
  min-height:100vh;
  background:var(--near-black-blue);
  overflow:hidden;
  font-family:'IBM Plex Mono',monospace;
}

/* coloured dirt pooling in the corners */
.grime{
  position:absolute;inset:0;pointer-events:none;
  opacity:var(--grime);
  background:
    radial-gradient(ellipse 40% 30% at 12% 78%, rgba(var(--byzantium-rgb),.45), transparent 70%),
    radial-gradient(ellipse 35% 25% at 82% 22%, rgba(var(--sea-blue-rgb),.2), transparent 70%),
    radial-gradient(ellipse 50% 40% at 65% 95%, rgba(15,158,80,.13), transparent 70%),
    radial-gradient(ellipse 30% 22% at 30% 10%, rgba(var(--glowing-pink-rgb),.12), transparent 70%);
}

/* faint CRT scanlines, tilted so they don't look digital */
.scanlines{
  position:absolute;inset:0;pointer-events:none;opacity:.35;
  background-image:repeating-linear-gradient(93deg, rgba(var(--light-blue-rgb),.04) 0 1px, transparent 1px 7px);
}

/* darkness pooling on the floor */
.floor-fade{
  position:absolute;left:0;right:0;bottom:0;height:46%;pointer-events:none;
  background:linear-gradient(to top, rgba(0,1,10,.9), transparent);
}

/* black arcs overhead — cables/roofline silhouettes */
.arc{position:absolute;pointer-events:none;border-bottom:3px solid #000;}
.arc-1{top:58px;  left:8%;   width:44%; height:120px; border-radius:0 0 60% 40%; filter:drop-shadow(0 1px 0 rgba(var(--sea-blue-rgb),.16));}
.arc-2{top:44px;  right:4%;  width:38%; height:170px; border-bottom-width:4px; border-radius:0 0 40% 55%; filter:drop-shadow(0 1px 0 rgba(var(--sea-blue-rgb),.16));}
.arc-3{top:-20px; left:-6%;  width:34%; height:210px; border-radius:0 0 70% 30%; filter:drop-shadow(0 1px 0 rgba(var(--sea-blue-rgb),.14));}
.arc-4{top:150px; left:26%;  width:52%; height:130px; border-bottom-width:2px; border-radius:0 0 45% 45%; filter:drop-shadow(0 1px 0 rgba(var(--sea-blue-rgb),.12));}
.arc-5{top:320px; right:-8%; width:30%; height:150px; border-radius:0 0 30% 60%; filter:drop-shadow(0 1px 0 rgba(var(--sea-blue-rgb),.1));}

/* thin cables dropping from the top edge */
.wire{position:absolute;top:0;width:2px;pointer-events:none;background:#000;transform-origin:50% 0;}
.wire-l{left:8%;  height:150px; transform:rotate(3deg);  box-shadow:1px 0 0 rgba(var(--sea-blue-rgb),.1);}
.wire-r{right:7%; height:126px; transform:rotate(-4deg); box-shadow:-1px 0 0 rgba(var(--sea-blue-rgb),.1);}

/* the sign's light bleeding into the sky */
.sky-glow{
  position:absolute;top:-90px;left:50%;width:1000px;height:420px;
  transform:translateX(-50%);pointer-events:none;
  background:radial-gradient(ellipse at center, rgba(var(--sea-blue-rgb),.16), transparent 66%);
}

.content{position:relative;min-height:100vh;padding:22px 5vw 140px;}


/* ── status line, top left ── */
.status{
  display:flex;align-items:center;gap:9px;
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;font-weight:500;line-height:1;
  letter-spacing:.22em;text-transform:uppercase;
  color:var(--ming);
}
.status-dot{
  width:7px;height:7px;border-radius:50%;
  background:var(--royal-shade);
  box-shadow:0 0 10px var(--royal-shade), 0 0 22px rgba(var(--royal-shade-rgb),.5);
  animation:buzz 2.6s infinite;
}


/* ══════════════════════════════════════════════════════
   THE SIGN
   ══════════════════════════════════════════════════════ */
.sign-rig{
  position:relative;width:fit-content;margin:0 auto;padding-top:78px;
  transform-origin:50% 0;
  animation:sway 7s ease-in-out infinite;
}

/* the rods it hangs from */
.rod{position:absolute;top:0;pointer-events:none;background:#000;}
.rod-l{left:14%;  width:4px;height:82px; box-shadow:1px 0 0 rgba(var(--sea-blue-rgb),.2), -1px 0 3px rgba(0,0,0,.9);}
.rod-r{right:14%; width:4px;height:82px; box-shadow:-1px 0 0 rgba(var(--sea-blue-rgb),.2), 1px 0 3px rgba(0,0,0,.9);}
.rod-thin-l{left:38%;  width:2px;height:80px; box-shadow:1px 0 0 rgba(var(--sea-blue-rgb),.12);}
.rod-thin-r{right:36%; width:2px;height:80px; box-shadow:-1px 0 0 rgba(var(--sea-blue-rgb),.12);}

/* the bolts at the end of each rod */
.bolt{
  position:absolute;top:72px;width:16px;height:16px;pointer-events:none;
  border-radius:50%;border:3px solid #000;
  box-shadow:0 0 0 1px rgba(var(--sea-blue-rgb),.16), 0 4px 10px rgba(0,0,0,.9);
}
.bolt-l{left:14%;  margin-left:-6px;}
.bolt-r{right:14%; margin-right:-6px;}

/* sparks jumping at each bolt */
.bolt-spark{
  position:absolute;top:76px;width:4px;height:4px;pointer-events:none;
  border-radius:50%;background:var(--alice-blue);
}
.bolt-spark-l{left:14%;  margin-left:-1px;
  box-shadow:0 0 8px var(--light-blue), 0 0 22px rgba(var(--sea-blue-rgb),.85);
  animation:spark 3.1s .8s infinite;}
.bolt-spark-r{right:14%; margin-right:-1px;
  box-shadow:0 0 8px var(--light-blue), 0 0 22px rgba(var(--glowing-pink-rgb),.6);
  animation:spark 2.6s 1.4s infinite;}

/* the broken bracket under the sign */
.break-notch{
  position:absolute;bottom:-1px;left:41%;z-index:4;
  width:22px;height:9px;margin-left:-11px;pointer-events:none;
  clip-path:polygon(0% 0%, 100% 0%, 72% 100%, 30% 62%);
  background:#02050f;
}

/* the shower of sparks coming off the break */
.sparks{position:absolute;bottom:-4px;left:41%;z-index:5;width:0;height:0;pointer-events:none;}
.sparks div{position:absolute;}
.spark-core{
  left:-1px;top:-2px;width:5px;height:5px;border-radius:50%;
  background:var(--alice-blue);
  box-shadow:0 0 8px var(--light-blue), 0 0 20px rgba(var(--sea-blue-rgb),.9), 0 0 34px rgba(var(--glowing-pink-rgb),.5);
  animation:spark 1.7s infinite;
}
.spark-green{
  left:4px;top:1px;width:3px;height:3px;border-radius:50%;
  background:#fff;
  box-shadow:0 0 6px var(--royal-shade), 0 0 16px rgba(var(--royal-shade-rgb),.7);
  animation:spark 2.3s .4s infinite;
}
.spark-arc{
  left:-14px;top:-8px;width:30px;height:12px;
  background:radial-gradient(ellipse at 50% 60%, rgba(var(--light-blue-rgb),.75), rgba(var(--sea-blue-rgb),.28) 45%, transparent 72%);
  animation:arc 1.7s infinite;
}
.spark-fall-1{
  left:1px;top:2px;width:2px;height:2px;border-radius:50%;
  background:#dff2f8;box-shadow:0 0 6px rgba(var(--sea-blue-rgb),.9);
  animation:fall 1.7s .05s infinite;
}
.spark-fall-2{
  left:3px;top:2px;width:2px;height:2px;border-radius:50%;
  background:#ff9ad8;box-shadow:0 0 6px rgba(var(--glowing-pink-rgb),.9);
  animation:fall 2.3s .45s infinite;
}

/* the jester mask swinging under the break */
.jester-hang{
  position:absolute;top:100%;left:41%;z-index:3;
  width:82px;margin-left:-41px;
  transform-origin:50% 0;
  animation:hang 9.4s ease-in-out infinite;
}
.jester-wire{
  width:2px;height:62px;margin:0 auto;
  background:linear-gradient(to bottom, #46647a, #24384a 55%, #16232f);
}
.jester-img{
  width:82px;height:82px;
  background-repeat:no-repeat;
  background-position:center;
  background-size:contain;
  /* the picture itself is baked in at the bottom of this stylesheet */
  opacity:.5;transform:rotate(19deg);
  animation:clown 1.15s infinite steps(1,end);
}

/* the sign panel — the dented metal box */
.sign-panel{
  position:relative;width:fit-content;max-width:min(92vw,720px);margin:0 auto;
  padding:10px 38px 24px;
  clip-path:polygon(0.8% 5%, 99.2% 0%, 100% 92%, 54% 100%, 1% 95%);
  background:linear-gradient(168deg, #071223 0%, #040a16 46%, #02050f 100%);
  box-shadow:0 26px 70px rgba(0,0,0,.8), inset 0 0 90px rgba(0,0,0,.75);
}
.panel-tint{
  position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(ellipse 50% 60% at 24% 88%, rgba(var(--byzantium-rgb),.3), transparent 60%),
    radial-gradient(ellipse 40% 50% at 86% 16%, rgba(var(--sea-blue-rgb),.14), transparent 60%);
}
.panel-grime{
  position:absolute;inset:0;pointer-events:none;opacity:.55;
  background-image:
    repeating-linear-gradient(97deg, rgba(var(--light-blue-rgb),.045) 0 1px, transparent 1px 4px),
    repeating-linear-gradient(4deg, rgba(0,0,0,.35) 0 2px, transparent 2px 9px),
    repeating-radial-gradient(circle at 30% 40%, rgba(var(--byzantium-rgb),.09) 0 1px, transparent 1px 13px);
}
.panel-border{position:absolute;inset:8px;pointer-events:none;border:1px solid rgba(var(--sea-blue-rgb),.09);}

/* the word itself */
.sign-text{
  position:relative;margin:0;text-align:center;
  font-family:'Neonderthaw',cursive;
  font-weight:400;
  font-size:clamp(60px,11vw,148px);
  line-height:1.14;
  color:var(--sea-blue);
  user-select:none;
}
/* every chunk of the word gets its own timer — that desync is
   what makes it read as broken instead of pulsing */
.sign-text span{display:inline-block;}
.l-ju{
  text-shadow:0 0 4px rgba(255,255,255,.5), 0 0 var(--glow) var(--sea-blue), 0 0 70px rgba(var(--sea-blue-rgb),.6);
  animation:flick 2.1s infinite;
}
.l-n{  /* the dead letter — no glow, just cold metal */
  color:var(--dark-slate);
  text-shadow:0 0 6px rgba(var(--sea-blue-rgb),.15);
  animation:dying 2.9s infinite;
}
.l-ky{
  text-shadow:0 0 4px rgba(255,255,255,.45), 0 0 var(--glow) var(--sea-blue), 0 0 66px rgba(var(--sea-blue-rgb),.55);
  animation:flick 1.3s infinite;
}
.l-a{  /* knocked crooked, and pink */
  transform:rotate(7deg) translateY(9px);
  color:var(--glowing-pink);
  text-shadow:0 0 4px rgba(255,255,255,.4), 0 0 var(--glow) var(--glowing-pink), 0 0 62px rgba(var(--glowing-pink-rgb),.5);
  animation:flick 2.6s infinite;
}
.l-rd{
  text-shadow:0 0 4px rgba(255,255,255,.45), 0 0 var(--glow) var(--sea-blue), 0 0 66px rgba(var(--sea-blue-rgb),.55);
  animation:dying 3.8s infinite;
}


/* ══════════════════════════════════════════════════════
   THE YARD FLOOR — where projects live
   ══════════════════════════════════════════════════════ */
.yard{position:relative;max-width:1240px;margin:0 auto;min-height:620px;}

/* handwriting */
.marker{position:absolute;font-family:'Permanent Marker',cursive;margin:0;}
.marker-welcome{
  top:20px;left:2%;max-width:300px;
  transform:rotate(-4deg);
  font-size:21px;line-height:1.4;
  color:var(--air-force-blue);
  text-shadow:0 0 12px rgba(var(--sea-blue-rgb),.35), 0 1px 0 rgba(0,0,0,.9);
}
.marker-hit{
  bottom:-46px;left:6px;transform:rotate(-6deg);
  font-size:17px;color:#4e7f8f;white-space:nowrap;
}
.marker-hauling{
  bottom:34px;left:10%;transform:rotate(-13deg);
  font-size:15px;color:#35606d;
}

/* Al-Ahli sign, bolted to the wall */
.ahli-sign{
  position:absolute;top:8px;right:0;padding:14px 26px 16px;
  transform:rotate(2.6deg);
  clip-path:polygon(1% 6%, 99% 0%, 100% 88%, 46% 100%, 3% 93%);
  background:linear-gradient(168deg, #0b1a22, #050b14);
  border-top:1px solid rgba(var(--sea-blue-rgb),.12);
  box-shadow:0 14px 40px rgba(0,0,0,.7);
}
.ahli-title{
  display:block;
  font-family:'Saira Stencil One',sans-serif;
  font-size:clamp(15px,1.6vw,22px);
  letter-spacing:.06em;
  color:var(--royal);
  text-shadow:0 0 14px var(--royal-shade);
  animation:flick 1.9s infinite;
}
.ahli-sub{
  display:block;margin-top:5px;
  font-family:'Saira Stencil One',sans-serif;
  font-size:clamp(12px,1.2vw,16px);
  letter-spacing:.14em;
  color:var(--ming);
  opacity:.9;
}

/* scrap metal lying around */
.junk{position:absolute;pointer-events:none;}
.junk-1{
  top:96px;left:62%;width:110px;height:70px;transform:rotate(-17deg);
  clip-path:polygon(0% 12%, 88% 0%, 100% 74%, 22% 100%);
  background:linear-gradient(140deg, #2a1428, #0c0a18);
  box-shadow:0 10px 24px rgba(0,0,0,.6);
}
.junk-2{
  top:300px;right:12%;width:190px;height:54px;transform:rotate(6deg);
  clip-path:polygon(0% 0%, 100% 14%, 96% 100%, 4% 84%);
  background:linear-gradient(100deg, #0a1620, #03040e);
  box-shadow:0 12px 30px rgba(0,0,0,.65);
}
.junk-3{
  bottom:-40px;left:-60px;width:280px;height:170px;transform:rotate(-11deg);
  clip-path:polygon(6% 0%, 100% 9%, 92% 100%, 0% 86%);
  background:linear-gradient(160deg, #150818, #03020e);
  box-shadow:0 -6px 40px rgba(0,0,0,.6);
}
.junk-4{
  bottom:60px;right:-70px;width:230px;height:230px;border-radius:50%;
  transform:rotate(14deg);opacity:.85;
  background:radial-gradient(circle at 38% 34%, #190a1b, #06030f 58%, #020209);
  box-shadow:inset 0 0 40px rgba(0,0,0,.9), 0 18px 50px rgba(0,0,0,.6);
}


/* ══════════════════════════════════════════════════════
   PROJECT 001 — the tally box
   ══════════════════════════════════════════════════════ */
.tally-rig{
  position:absolute;top:214px;left:6%;
  transform:rotate(-5deg);
  transition:transform .18s cubic-bezier(.3,1.6,.5,1);
}
.tally-tag{
  position:absolute;top:-16px;left:-26px;width:96px;height:26px;
  transform:rotate(-8deg);
  background:rgba(var(--sea-blue-rgb),.14);
  border:1px solid rgba(var(--sea-blue-rgb),.12);
  box-shadow:0 3px 8px rgba(0,0,0,.5);
}
.tally-box{
  position:relative;cursor:pointer;
  width:172px;height:172px;padding:0;border:none;
  background:linear-gradient(152deg, #12222c 0%, #0a1420 48%, #04070f 100%);
  box-shadow:0 20px 50px rgba(0,0,0,.75), inset 0 0 40px rgba(0,0,0,.7);
  clip-path:polygon(3% 2%, 98% 0%, 100% 95%, 52% 100%, 2% 97%);
}
.tally-box:active{filter:brightness(1.35);}
.tally-glow{
  position:absolute;inset:0;
  background:
    radial-gradient(circle at 22% 78%, rgba(var(--byzantium-rgb),.55), transparent 52%),
    radial-gradient(circle at 84% 20%, rgba(var(--sea-blue-rgb),.22), transparent 46%);
}
.tally-frame{
  position:absolute;inset:11px;opacity:.9;
  border:2px solid var(--glowing-pink);
  box-shadow:0 0 16px rgba(var(--glowing-pink-rgb),.55), inset 0 0 14px rgba(var(--glowing-pink-rgb),.15);
  clip-path:polygon(0% 4%, 100% 0%, 98% 100%, 2% 96%);
  animation:buzz 2.2s infinite;
}
.tally-num{
  position:relative;display:block;
  font-family:'Space Grotesk',sans-serif;
  font-size:62px;line-height:172px;
  color:var(--sea-blue);
  text-shadow:0 0 18px rgba(var(--sea-blue-rgb),.9);
}

.tally-readout{
  position:absolute;top:430px;left:31%;
  transform:rotate(3deg);
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;letter-spacing:.18em;text-transform:uppercase;
  color:#3a5f6c;
}
.scrap-btn{
  position:absolute;top:462px;left:31%;
  transform:rotate(3deg);cursor:pointer;
  background:transparent;
  border:1px dashed rgba(var(--byzantium-rgb),.9);
  color:#8a5f80;
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;font-weight:500;line-height:1;
  letter-spacing:.16em;text-transform:uppercase;
  padding:8px 11px;
}
.scrap-btn:hover{color:var(--glowing-pink);border-color:rgba(var(--glowing-pink-rgb),.7);}

/* keyboard users need to see where they are */
.tally-box:focus-visible,
.scrap-btn:focus-visible{outline:2px solid var(--glowing-pink);outline-offset:5px;}

  .junkyard,.junkyard *{animation:none !important;transition:none !important;}
}

</head>
<body>

<div class="junkyard">

  <!-- ── atmosphere ── -->
  <div class="grime"></div>
  <div class="scanlines"></div>
  <div class="floor-fade"></div>

  <div class="arc arc-1"></div>
  <div class="arc arc-2"></div>
  <div class="arc arc-3"></div>
  <div class="arc arc-4"></div>
  <div class="arc arc-5"></div>

  <div class="wire wire-l"></div>
  <div class="wire wire-r"></div>

  <div class="sky-glow"></div>

  <div class="content">

    <div class="status">
      <span class="status-dot"></span>
      <span>24 h · online</span>
    </div>

    <!-- ── THE SIGN ── -->
    <div class="sign-rig">

      <div class="rod rod-l"></div>
      <div class="bolt bolt-l"></div>
      <div class="bolt-spark bolt-spark-l"></div>

      <div class="rod rod-r"></div>
      <div class="bolt bolt-r"></div>
      <div class="bolt-spark bolt-spark-r"></div>

      <div class="rod rod-thin-l"></div>
      <div class="rod rod-thin-r"></div>

      <div class="break-notch"></div>
      <div class="sparks">
        <div class="spark-core"></div>
        <div class="spark-green"></div>
        <div class="spark-arc"></div>
        <div class="spark-fall-1"></div>
        <div class="spark-fall-2"></div>
      </div>

      <div class="jester-hang">
        <div class="jester-wire"></div>
        <div class="jester-img"></div>
      </div>

      <div class="sign-panel">
        <div class="panel-tint"></div>
        <div class="panel-grime"></div>
        <div class="panel-border"></div>
        <h1 class="sign-text"><span class="l-ju">Ju</span><span class="l-n">n</span><span class="l-ky">ky</span><span class="l-a">a</span><span class="l-rd">rd</span></h1>
      </div>

    </div>

    <!-- ── THE YARD — projects go in here ── -->
    <div class="yard">

      <p class="marker marker-welcome">welcome to<br>the junkyard</p>

      <div class="ahli-sign">
        <span class="ahli-title">ASIA CHAMPIONS</span>
        <span class="ahli-sub">AL-AHLI · 24/25 → 25/26</span>
      </div>

      <div class="junk junk-1"></div>
      <div class="junk junk-2"></div>
      <div class="junk junk-3"></div>
      <div class="junk junk-4"></div>

      <!-- PROJECT 001 -->
      <div class="tally-rig">
        <div class="tally-tag"></div>
        <button class="tally-box">
          <span class="tally-glow"></span>
          <span class="tally-frame"></span>
          <span class="tally-num">0</span>
        </button>
        <span class="marker marker-hit">hit it →</span>
      </div>

      <span class="tally-readout">tally 0 · this run 0</span>
      <button class="scrap-btn">scrap it</button>

      <span class="marker marker-hauling">keep hauling</span>

    </div>

  </div>
</div>

<script>
/* ── PROJECT 001 — the tally box ── */

const tallyBox = document.querySelector('.tally-box');
const tallyNum = document.querySelector('.tally-num');
const tallyRig = document.querySelector('.tally-rig');
const readout  = document.querySelector('.tally-readout');
const scrapBtn = document.querySelector('.scrap-btn');

/* localStorage is the browser's little notepad — it survives a refresh.
   Number(...) turns the saved text back into a real number.
   || 0  means "if there's nothing saved yet, start at zero". */
let count   = Number(localStorage.getItem('junkyard.tally')) || 0;
let session = 0;

function draw(){
  tallyNum.textContent = count;
  readout.textContent  = 'tally ' + count + ' · this run ' + session;
}

tallyBox.addEventListener('click', function(){
  count   = count + 1;
  session = session + 1;
  localStorage.setItem('junkyard.tally', count);

  /* knock the box a bit crooked, differently every time */
  const tilt = -8 + Math.random() * 10;
  tallyRig.style.transform = 'rotate(' + tilt.toFixed(1) + 'deg)';

  draw();
});

scrapBtn.addEventListener('click', function(){
  count = 0;
  localStorage.setItem('junkyard.tally', 0);
  tallyRig.style.transform = 'rotate(-5deg)';
  draw();
});

draw();
</script>

</body>
</html>
